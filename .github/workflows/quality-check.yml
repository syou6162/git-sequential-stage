name: Quality Check

on: push

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.26'

    - name: Check Go formatting
      run: test -z "$(gofmt -l .)"

    - name: Check Go simplifications
      run: test -z "$(gofmt -s -l .)"

    - name: Go vet
      run: go vet ./...

    - name: Go mod verify
      run: go mod verify
